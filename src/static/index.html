<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slalom Capabilities Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <img src="https://colby-timm.github.io/images/byte-teacher.png" alt="Byte mascot" class="mascot" />
        <div class="header-text">
          <h1>Slalom Capabilities Management</h1>
          <h2>Consulting Expertise Platform</h2>
        </div>
      </div>
    </header>

    <main>
      <section id="capabilities-container">
        <h3>Available Capabilities</h3>
        <div id="capabilities-list">
          <!-- Capabilities will be loaded here -->
          <p>Loading capabilities...</p>
        </div>
      </section>

      <section id="register-container">
        <h3>Register Your Expertise</h3>
        <form id="register-form">
          <div class="form-group">
            <label for="email">Consultant Email:</label>
            <input type="email" id="email" required placeholder="your-email@slalom.com" />
          </div>
          <div class="form-group">
            <label for="capability">Select Capability:</label>
            <select id="capability" required>
              <option value="">-- Select a capability --</option>
              <!-- Capability options will be loaded here -->
            </select>
          </div>
          <button type="submit">Register Expertise</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="consultants-container">
        <h3>Consultant Profiles</h3>
        <form id="consultant-form">
          <h4 id="consultant-form-title">Create Consultant Profile</h4>
          <div class="form-group">
            <label for="consultant-email">Consultant Email:</label>
            <input type="email" id="consultant-email" required placeholder="consultant@slalom.com" />
          </div>
          <div class="form-group">
            <label for="consultant-name">Consultant Name:</label>
            <input type="text" id="consultant-name" required placeholder="Jordan Lee" />
          </div>
          <div class="form-group">
            <label for="consultant-practice-area">Practice Area:</label>
            <select id="consultant-practice-area" required>
              <option value="">-- Select a practice area --</option>
              <option value="Technology">Technology</option>
              <option value="Strategy">Strategy</option>
              <option value="Operations">Operations</option>
            </select>
          </div>
          <div class="form-group">
            <label for="consultant-availability">Availability:</label>
            <input type="text" id="consultant-availability" placeholder="20 hours/week" />
          </div>
          <div class="form-group">
            <label for="consultant-certifications">Certifications:</label>
            <input type="text" id="consultant-certifications" placeholder="AWS Solutions Architect, SAFe Agilist" />
          </div>
          <div class="form-group">
            <label for="consultant-skills">Skills:</label>
            <input type="text" id="consultant-skills" placeholder="Cloud Architecture, Facilitation" />
          </div>
          <div class="form-actions">
            <button type="submit" id="consultant-submit">Save Consultant Profile</button>
            <button type="button" id="consultant-cancel" class="secondary-btn hidden">Cancel Edit</button>
          </div>
        </form>
        <div id="consultants-list">
          <p>Loading consultant profiles...</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <img src="https://colby-timm.github.io/images/byte-celebrate.png" alt="Byte celebrating" class="footer-mascot" />
        <p>&copy; 2025 Slalom • Building Better Tomorrow</p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
